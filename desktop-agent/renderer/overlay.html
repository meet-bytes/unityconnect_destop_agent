<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Warning</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="overlay-backdrop"></div>
    <div class="overlay-content">
      <div id="countdownContainer" class="countdown-container hidden">
        <div class="countdown-number" id="countdownNumber"></div>
        <div class="countdown-message">
          <span>You're inactive. Move your mouse or press any key to stay active.</span>
          <br />
          <span>Idle mode starts when the timer reaches 0.</span>
        </div>
      </div>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
